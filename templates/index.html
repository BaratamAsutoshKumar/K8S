<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Digit Recognizer</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 flex items-center justify-center min-h-screen">
  <div class="bg-white p-8 rounded-2xl shadow-lg max-w-md w-full text-center">
    <h1 class="text-3xl font-bold text-gray-800 mb-2">Digit Recognizer</h1>
    <p class="text-gray-600 mb-8">
      Upload an image of a handwritten digit (0–9) to see the model’s prediction.
    </p>

    <!-- Upload form -->
    <form action="/predict" method="post" enctype="multipart/form-data" class="space-y-6">
      <div class="flex flex-col items-center gap-4">
        <label for="file-upload"
               class="cursor-pointer bg-indigo-50 text-indigo-700 font-semibold py-3 px-6 rounded-xl hover:bg-indigo-100 transition duration-200 block w-fit">
          Select an Image
        </label>
        <input id="file-upload" name="file" type="file" class="sr-only" onchange="displayFileName(this)" />
        <p id="file-name" class="text-sm text-gray-500"></p>
      </div>

      <button type="submit"
              class="w-full bg-indigo-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-indigo-700 transition duration-200">
        Predict Digit
      </button>
    </form>

    {% if prediction_text %}
    <div class="mt-8 p-4 bg-green-50 border border-green-200 rounded-lg shadow-sm">
      <h2 class="text-2xl font-semibold text-green-800">{{ prediction_text }}</h2>
    </div>
    {% endif %}
  </div>

  <script>
    function displayFileName(input) {
      const fileNameDisplay = document.getElementById('file-name');
      if (input.files.length > 0) {
        fileNameDisplay.textContent = `Selected file: ${input.files[0].name}`;
      } else {
        fileNameDisplay.textContent = '';
      }
    }
  </script>
</body>
</html>
